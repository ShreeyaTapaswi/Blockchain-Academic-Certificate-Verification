<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Institution Login - CertChain | Shreeya Tapaswi</title>
<style>
:root{--navy:#1f3864;--blue:#2f5496;--muted:#5b6478;--bad:#b3261e;--badbg:#fdeceb;--line:#dde2ee}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;font-family:"Segoe UI",system-ui,sans-serif;color:#1b2233;
 background:radial-gradient(circle at 15% 10%,#3b5bb5 0,transparent 45%),radial-gradient(circle at 90% 90%,#7b4dd6 0,transparent 40%),linear-gradient(135deg,#14264d,#1f3864)}
.box{width:100%;max-width:400px;background:#fff;border-radius:18px;padding:34px 30px 26px;box-shadow:0 18px 50px #0006}
.logo{width:54px;height:54px;border-radius:14px;background:linear-gradient(135deg,#2f5496,#7b4dd6);color:#fff;display:grid;place-items:center;font-size:28px;margin:0 auto 12px}
h1{margin:0;text-align:center;font-size:22px;color:var(--navy)}
.sub{text-align:center;color:var(--muted);font-size:13.5px;margin:6px 0 22px}
label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin:14px 0 5px}
input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;font-size:15px;font-family:inherit}
input:focus{outline:2px solid #9db4e8;border-color:var(--blue)}
.pw{position:relative}.pw button{position:absolute;right:6px;top:5px;border:0;background:none;cursor:pointer;font-size:13px;color:var(--blue);padding:6px 8px}
.go{width:100%;margin-top:22px;padding:12px;border:0;border-radius:10px;background:var(--blue);color:#fff;font-weight:700;font-size:15px;cursor:pointer}
.go:hover{background:var(--navy)}
.err{background:var(--badbg);color:var(--bad);border:1px solid #f3c1be;border-radius:9px;padding:9px 12px;font-size:13.5px;margin-bottom:6px;font-weight:600}
.alt{text-align:center;margin-top:20px;padding-top:16px;border-top:1px solid #eef1f8;font-size:13.5px;color:var(--muted)}
.alt a{color:var(--blue);font-weight:600;text-decoration:none}.alt a:hover{text-decoration:underline}
.note{font-size:12px;color:#8a93a8;text-align:center;margin-top:14px}
</style></head><body>
<div class="box">
  <div class="logo">&#9939;</div>
  <h1>Institution login</h1>
  <p class="sub">Only authorised administrators can issue, revoke or manage certificates.</p>
  {% if error %}<div class="err">&#9888; {{ error }}</div>{% endif %}
  <form method="post" autocomplete="on">
    <label for="u">Username</label>
    <input id="u" name="username" autocomplete="username" autofocus required>
    <label for="p">Password</label>
    <div class="pw"><input id="p" name="password" type="password" autocomplete="current-password" required>
      <button type="button" onclick="var i=document.getElementById('p');i.type=i.type==='password'?'text':'password';this.textContent=i.type==='password'?'Show':'Hide'">Show</button></div>
    <button class="go" type="submit">Sign in</button>
  </form>
  <div class="alt">Just want to check a certificate?<br><a href="/">&#128269; Verify a certificate &mdash; no login needed</a></div>
  <div class="note">CertChain &middot; Made by <b>Shreeya Tapaswi</b></div>
</div>
</body></html>
